name: Compila APK

on:
  push:
  workflow_dispatch:

# per pubblicare la release con l'APK
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # il modello vocale (~50 MB) viene scaricato una volta e poi tenuto in cache
      - uses: actions/cache@v4
        with:
          path: app/src/main/assets/model-it
          key: vosk-model-small-it-0.22

      # chiave privata di firma, dai segreti del repository (Settings → Secrets and variables → Actions)
      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Mancano i segreti KEYSTORE_BASE64 e KEYSTORE_PASSWORD: aggiungili in Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test della logica e build
        env:
          # ogni build ha un numero di versione più alto: l'app riconosce gli aggiornamenti
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: assistente
        run: |
          chmod +x gradlew
          ./gradlew test assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: AssistenteVocale-apk
          path: app/build/outputs/apk/release/app-release.apk

      # link fisso: .../releases/latest/download/AssistenteVocale.apk
      - name: Pubblica la release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk AssistenteVocale.apk
          git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.txt
          gh release create "v1.${{ github.run_number }}" AssistenteVocale.apk \
            --title "Versione 1.${{ github.run_number }}" \
            --notes-file notes.txt \
            --latest
          # tiene solo le ultime 5 versioni
          gh release list --limit 100 --json tagName -q '.[5:][].tagName' \
            | xargs -r -n1 gh release delete --cleanup-tag --yes
