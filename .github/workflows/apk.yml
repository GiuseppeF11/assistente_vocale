name: Compila APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # il modello vocale (~50 MB) viene scaricato una volta e poi tenuto in cache
      - uses: actions/cache@v4
        with:
          path: app/src/main/assets/model-it
          key: vosk-model-small-it-0.22

      - name: Test della logica e build
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AssistenteVocale-apk
          path: app/build/outputs/apk/debug/app-debug.apk
